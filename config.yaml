# config.yaml — IATIS Governance Layer (core)
# -----------------------------------------------------------------------
# Symbol universe, engine activation/versions, risk limits, and the AI
# provider layer live in config/symbols.yaml, config/engines.yaml,
# config/risk.yaml, config/ai.yaml (split 2026-07-12 — see each file's
# header comment). utils/helpers.py::load_config() merges them all into
# one effective dict identical in shape to the pre-split monolithic
# file; every module that calls load_config() is unaffected.
#
# THREE SCORE THRESHOLDS — do not confuse these, and do not collapse
# them into one formula without a new pre-registered hypothesis (doing
# so would change every symbol's effective trigger point mid-sample,
# which CLAUDE.md forbids while the forward-evidence counter is open):
#   1. confluence.min_score_to_trade (below, system-wide) — the
#      confluence engine's own floor for calling a setup tradeable at
#      all, evaluated first, inside confluence scoring.
#   2. data.twelve_data_symbols[i].min_score (config/symbols.yaml) —
#      a PER-SYMBOL floor, evaluated next; some symbols require more
#      conviction than the system-wide floor (e.g. NAS100/ETHUSD at 60
#      vs the 58 default), reflecting measured per-symbol noise.
#   3. execution.min_score_to_execute (below) — the final gate right
#      before an order is placed, independent of confluence scoring.
#      A signal must clear ALL THREE, in this order, to become a trade.
confluence:
  min_engines_agreeing: 2
  min_score_to_trade: 58
  # Axis-8 gate (philosophy audit): at least this fraction of the ENABLED
  # panel's weight must produce an informative (non-NEUTRAL, above the
  # conviction threshold) vote — agreeing or dissenting — for confluence
  # to mean anything. Prevents the 2-of-4 quorum from silently degenerating
  # into "the only two fed engines co-signed" when the rest of the panel
  # is mute (e.g. a data-starved NNFX). 0.0 disables the gate.
  # Calibrated at 0.6: the observed live failure mode (NNFX+Wyckoff mute,
  # only SMC+PriceAction speaking) is ~57% of enabled weight and must FAIL;
  # any healthy mix that includes a speaking NNFX is >=60% and passes.
  # NNFX-NEUTRAL-with-SMC+PA-only also fails by design: no trend baseline,
  # no trend trade.
  min_informative_weight_share: 0.6
  weights:
    divergence: 0.0606
    ict: 0.0657
    macro: 0.0
    market_structure: 0.0859
    nnfx: 0.2273
    price_action: 0.1869
    quant: 0.0707
    sentiment: 0.0303
    smc: 0.202
    wyckoff: 0.0707
data:
  # 3000 H1 bars → ~750 resampled H4 bars and ~125 resampled D1 bars.
  # The Twelve Data Free plan serves H4/D1 as resamples of the H1 fetch
  # (core/data_loader.py), so this depth is what feeds NNFX (needs 210+
  # decision-TF bars for EMA200) and the MTF D1 gate (needs 50+ D1 bars).
  # At the previous 500, both were silently starved in live operation —
  # see docs/PHILOSOPHY_AUDIT_2026-07_ADDENDUM_LIVE.md. Free-plan max per
  # request is 5000; cost is 1 credit per request regardless of size.
  bars_to_load: 3000
  # Asset-class provider chains (core/data_providers.py). Order matters —
  # first provider that serves the timeframe NATIVELY wins; resampling is
  # the last resort. cTrader activates automatically when its credentials
  # exist in .env (it is the broker feed live trades execute against —
  # eliminates data-source/backtest divergence like the documented NZDUSD
  # broker-vs-TwelveData discrepancy). ccxt = Binance, free, unlimited,
  # native H4/D1 for crypto. Omit this block to use the same defaults.
  # fcs_api added 2026-07-14 (fx/metals/indices only): sits right after
  # twelve_data, or right after ctrader for indices (no twelve_data entry
  # there). Needs FCS_API_KEY in .env; falls through cleanly without it.
  # yahoo_finance demoted to last in every chain (2026-07-14, operator
  # request): least reliable of this set (no rate-limit contract, throttles
  # under heavy use, H4 is a resample not a native candle) — kept as a
  # fallback, not removed.
  provider_chains:
    # alpaca (2026-07-16): crypto ONLY — US stocks + crypto venue, no
    # FX/metals/index CFDs. First fallback after ccxt AND the independent
    # cross-check partner for core/data_confidence.py on the carriers.
    # yahoo_finance REMOVED from all chains (2026-07-16): measured wrong
    # instruments (^IXIC≠NDX, futures≠spot metals, cash sessions, H4 as a
    # 1h resample) — a missing bar is recoverable, a plausible-but-wrong
    # bar poisons decisions silently. Fetcher kept for offline diffs only.
    crypto:  [ccxt, alpaca, twelve_data, finnhub]
    # metals (2026-08-10, operator override): dukascopy_jforex + alpha_vantage
    # added ahead of the live-fetch verification / data_confidence
    # divergence-free stretch this rollout originally called for (see the
    # fx entry's history below) — XAG/USD had ZERO working provider that
    # day (ctrader token dead, fcs_api monthly quota exhausted, finnhub has
    # no XAG mapping, twelve_data free tier 404s XAGUSD). alpha_vantage is
    # ALSO a deliberate scope widening beyond CLAUDE.md's documented "AV
    # (fx only)" data-layer policy — same reasoning: no working fallback
    # left for XAG/USD. Watch GET /data-confidence for divergence on
    # XAU/USD and XAG/USD now that dukascopy_jforex is live here unverified.
    metals:  [ctrader, dukascopy_jforex, twelve_data, fcs_api, alpha_vantage, finnhub]
    # energy/indices (2026-08-10, same operator override as metals):
    # USOIL -> LIGHT.CMD/USD, US30 -> USA30.IDX/USD, SPX500 ->
    # USA500.IDX/USD, NAS100 -> USATECH.IDX/USD, confirmed live against
    # the operator's own Dukascopy JForex app (Commodities CFD / Indices
    # CFD tabs) — see core/data_providers.py's
    # _DUKASCOPY_JFOREX_INST_ID_MAP. NOT yet fetch-verified through the
    # bridge itself: the bridge's own dukascopy.subscription-instruments
    # property (a separate config file on the VPS, outside this repo)
    # still needs these 4 instrument codes added and the bridge
    # restarted before any of these actually return data instead of a
    # cheap, fast-failing 500 — same class of gap the fx entry already
    # has for 9 of its 12 pairs (see below).
    energy:  [ctrader, dukascopy_jforex, finnhub]
    indices: [ctrader, dukascopy_jforex, fcs_api, finnhub]
    # dukascopy_jforex (2026-08-07): opted into fx first (right after
    # ctrader, never first) — per docs/DUKASCOPY_JFOREX_BRIDGE_SETUP.md's
    # own recommended rollout, live-verified end-to-end on the operator's
    # VPS for EUR/USD only. Extended to metals/energy/indices on
    # 2026-08-10 (see entries above) WITHOUT the same live-fetch
    # verification — an explicit operator override, not a completed
    # rollout step. crypto (BTC/USD, ETH/USD) the bridge also subscribes
    # to is still NOT added anywhere; ccxt already covers crypto reliably.
    # Still unofficial, third-party bridge code — see the setup doc's
    # "Known fragility" section before expanding scope further.
    fx:      [ctrader, dukascopy_jforex, twelve_data, fcs_api, alpha_vantage, finnhub]
    # stocks/etf — LIVE-VERIFIED on the VPS 2026-07-24 (real probe, 4
    # starter symbols, scripts/probe_equity_data_providers.py):
    #   alpaca:        CONFIRMED WORKING after fixing a real bug — the
    #                  first request returned only 1 (today's) bar
    #                  instead of history because start/end were omitted;
    #                  fixed by sending an explicit date window
    #                  (core/data_providers.py::_fetch_alpaca_equity).
    #                  Already integrated for crypto (2026-07-16); only
    #                  the stock half was missing until 2026-07-24 despite
    #                  its own code comment claiming both. Placed first —
    #                  broker-integrated source, not a bolt-on API.
    #   twelve_data:   CONFIRMED WORKING, 30 daily bars, no changes needed
    #                  (client was already fully generic).
    #   alpha_vantage: CONFIRMED WORKING, 30 daily bars via TIME_SERIES_DAILY.
    #   finnhub:       CONFIRMED BROKEN — HTTP 403 on /stock/candle for
    #                  all 4 symbols. Its own docstring's "Free tier
    #                  supports... US stocks" claim predates this endpoint
    #                  ever being called and is wrong for stock candles
    #                  specifically (confirmed paid-plan-gated). Left in
    #                  the chain (last) as a harmless no-op fallback.
    stocks:  [alpaca, twelve_data, alpha_vantage, finnhub]
    etf:     [alpaca, twelve_data, alpha_vantage, finnhub]
  # Valid values: twelve_data | ctrader | injected (backtests only).
  # synthetic is disallowed under system.mode=live — scheduler.py's main()
  # refuses to start rather than trade on fabricated bars (see the guard
  # right after the TWELVE_DATA_API_KEY check there). Tests/backtests may
  # still pass source=synthetic directly to run_pipeline()/run_once() —
  # that's an intentional, separate hermetic-test path, not this guard.
  source: twelve_data
  symbol: EURUSD
  # Decision timeframe = first entry. H4-primary setup: engine votes,
  # regime, MQS and risk math run on 4-hour bars; D1 confirms the trend
  # via the MTF gate (H4 signal vs D1 EMA20/50+ADX) and H1 stays fetched
  # as auxiliary timing context. Telegram alerts dedup per decision bar,
  # so a 2-hourly scheduler still sends at most one alert per H4 candle.
  timeframes:
  - H4
  - D1
  - H1
  # twelve_data_symbols moved to config/symbols.yaml (2026-07-12) — the
  # per-symbol governance record (asset_class, status, status_reason,
  # status_since) plus the fields code actually reads (enabled, internal,
  # min_score, rr, symbol). Merged back into data.twelve_data_symbols by
  # utils/helpers.py::load_config(); XAGUSD/USOIL/US30/NAS100/SPX500 are
  # NOT served by Twelve Data Free (404, plan-gated — verified
  # 2026-07-05). Stale note removed 2026-08-10: this used to say Yahoo
  # Finance covered the gap automatically, but Yahoo was REMOVED from
  # every chain on 2026-07-16 (see provider_chains above) — for the two
  # metals (XAGUSD/XAUUSD) the real fallback now is dukascopy_jforex +
  # alpha_vantage (provider_chains.metals, 2026-08-10 operator override).
  # USOIL/US30/NAS100/SPX500 (energy/indices) still have no equivalent
  # fallback for this specific gap.
# engines: moved to config/engines.yaml (2026-07-12) — activation
# (smc_full_spec, enabled.<name>) plus version metadata. Merged back into
# the top-level `engines` key by load_config(). H017 (SMC full-spec) is
# OFF until scripts/smc_fullspec_ab.py shows an OOS improvement —
# flipping it changes live voting behavior; see registry H017.
# Order execution. Defaults are SAFE — nothing is placed until you opt in.
#   Layer-2 forward evidence (real orders on the cTrader DEMO account):
#     set ctrader_enabled: true  AND  dry_run: false   (leave the two flags
#     below as-is). Every filled trade then feeds the 100-trade evidence
#     counter with real spread/slippage instead of simulation.
#   allow_live_trading gates REAL-MONEY orders: the executor hard-refuses to
#     trade a non-demo cTrader account unless this is true. Keep it false
#     until forward paper trading proves the edge (audit Phase 5).
execution:
  broker: ctrader
  # LIVE ON DEMO (2026-07-06): collecting real forward-trade evidence on the
  # cTrader demo account (env=demo, $200). Real orders with real spread/
  # slippage feed the 100-trade counter. allow_live_trading stays false, so
  # the executor still hard-refuses any non-demo account. To pause: set
  # dry_run back to true (simulate) or ctrader_enabled back to false.
  ctrader_enabled: true       # true + dry_run:false → real orders on the cTrader demo
  dry_run: false              # false = place real orders (on the demo account)
  allow_live_trading: false   # money-safety gate for LIVE (non-demo) accounts — keep false
  max_open_trades: 5
  # Open-outcome hygiene (philosophy audit, priority 4): force-close any
  # paper signal still open after this many hours, at market, labeled by
  # realized R (win/loss/breakeven). Without it, signals that never touch
  # TP/SL linger forever, saturate the 5% exposure cap (5 × 1% slots) and
  # block every new trade — 39 such rejections observed live. 168h = 7
  # days ≈ 42 H4 bars. 0 disables.
  max_open_trade_hours: 168
  min_score_to_execute: 60.0
  oanda_enabled: false
  # Dukascopy JForex (2026-08-08) — via the local dukas-api bridge, see
  # execution/dukascopy_jforex_client.py's module docstring and docs/
  # DUKASCOPY_JFOREX_BRIDGE_SETUP.md. UNAUDITED THIRD-PARTY BRIDGE CODE —
  # stays false until you've run the mandatory single-order manual-
  # verification step (inspect SL/TP/size in the real JForex terminal)
  # described in that doc. Same true/dry_run:false → real orders,
  # allow_live_trading gates non-demo, pattern as ctrader_enabled above.
  dukascopy_jforex_enabled: false
  # No account-balance endpoint exists on the bridge (see the client's
  # docstring) — position size is this fixed quantity, never risk_pct-
  # derived. 0.0 = refuse to trade (fail loud, never guess a size).
  dukascopy_jforex_fixed_quantity: 0.0
# On/off switches for real, already-built gates — toggle behavior without
# editing code. This is NOT the feature store (utils/feature_def.py, a
# separate indicator/versioning registry) — different concept, same word.
# Every flag here maps to one real conditional; see the file:line noted.
features:
  market_quality_gate: true      # main.py — MQS gate can block/allow trades
  # H103 (research/results/registry.json, PLANNED): existing live gate —
  # default TRUE preserves current behavior. Set false only inside the
  # H103 A/B harness's arm B; do not flip live before the hypothesis
  # resolves and is promoted (CLAUDE.md rule 6).
  meta_decision_gate: true
  correlation_filter: true       # scheduler.py — portfolio correlation cap
  ai_weight_suggestions: true    # execution/api_server.py — POST /ai/optimize-weights
  # core/data_confidence.py — cross-provider close check, ONE symbol per
  # scheduler run (round-robin). Monitoring only, NEVER a gate. Costs
  # ~1-2 extra provider calls per run. History at GET /data-confidence;
  # MATERIAL disagreement alerts via Telegram. Enabled 2026-07-27 after
  # the FX/BTCUSD staleness investigation (Data Center dashboard showing
  # STALE for FX pairs + BTCUSD) — this won't diagnose why a decision
  # stopped being recorded, but it starts building real cross-provider
  # divergence history for whichever symbols DO still get scanned.
  data_confidence_check: true
  data_confidence_interval: H1   # timeframe compared
  data_confidence_bars: 48       # bars compared per check
  data_confidence_tolerance_pct: 0.05  # per-bar close divergence tolerance
  # execution/reconciliation.py — per-tick broker-vs-internal open-position
  # diff. Self-gates: only acts when ctrader_enabled and dry_run:false
  # (paper mode has no broker book to reconcile). Mismatch → Telegram.
  broker_reconciliation: true
  # execution/post_trade_monitor.py — turns each tick's ALREADY-COMPUTED
  # reconciliation/execution_attempts/execution_quality/kill_switch/
  # forward_review evidence into durable incidents (storage/
  # post_trade_incidents.py). Purely observational: never gates trading,
  # never mutates the kill switch, never auto-closes a position.
  post_trade_monitoring: true
fundamentals:
  blackout_look_ahead_min: 60
  news_filter_enabled: true
# Root logger (utils/logger.py). `level` can be overridden per-environment
# via IATIS_LOG_LEVEL. `file` empty = stderr only (the systemd units already
# capture stderr into journald); set a path to ALSO write a rotating file
# (10 MB x 5 backups). These keys used to live, unread, under fundamentals:
# — file logging silently never existed (production audit, Phase 9).
logging:
  level: INFO
  file: ""
# Market Quality Score gate (core/market_quality.py) — session/volatility/
# day-of-week scoring that decides whether conditions are good enough to
# run the engines at all. Already active in every live run; these are its
# two thresholds, previously hardcoded module constants.
market_quality:
  threshold_good: 60    # score >= this => grade GOOD, full size
  threshold_fair: 40    # score >= this => grade FAIR, trade but reduced size; below => NO_TRADE
# Read-only warning thresholds for GET /health/full (execution/api_server.py).
# Purely informational — crossing these does not stop trading, it only
# flips the dashboard's Mission Control status to "degraded".
monitoring:
  ram_warn_pct: 85
  disk_warn_pct: 80
# Portfolio-level correlation cap (risk/correlation_engine.py), already
# enforced in every scheduler.py run — max_per_group was a hardcoded
# module constant before this.
portfolio:
  max_per_group: 2   # max concurrent EXECUTE signals from the same correlation group per run
regime:
  atr_period: 14
  lookback: 100
# risk: moved to config/risk.yaml (2026-07-12) — FROZEN until the shadow
# book reaches n~=50/gate, see that file's header. Merged back into the
# top-level `risk` key by load_config().
# ai: moved to config/ai.yaml (2026-07-12) — explanation/reporting layer
# only (ai/ai_analyzer.py), never feeds final_verdict. Merged back into
# the top-level `ai` key by load_config().
system:
  mode: live
  name: IATIS
  version: 0.5.9
telegram:
  enabled: true
