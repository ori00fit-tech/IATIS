# config/engines.yaml — Engine Activation & Version Metadata
# -----------------------------------------------------------------------
# Split out of config.yaml (2026-07-12). Loaded and merged into the
# top-level `engines` key by utils/helpers.py::load_config().
#
# CODE READS ONLY: engines.smc_full_spec, engines.crypto_positioning_modulator,
# engines.enabled.<name> (bool), engines.thresholds.<name> (Confluence
# Engine Overhaul Phase 1 — pure config extraction, see `thresholds:`
# below; every value there is unchanged from its prior hardcoded default),
# engines.versions.<name> (Engine Refinement V1, §5 — main.
# build_active_engines / the backtest engine construction loop set each
# engine's .version attribute from here; safe_analyze() copies it onto
# every EngineOutput.engine_version. Purely observational tagging for
# research traceability — it is never consulted by tally_votes()/the live
# gate/any scoring logic, exactly like thresholds' own gate/vote parity
# guarantee). It exists so engine iterations can be compared over time
# without guessing which code version produced which research/results
# manifest.
#
# Frozen per CLAUDE.md: engines enabled = smc, price_action, nnfx,
# wyckoff (prod4), kept by burden-of-proof (H015 closed: no robust
# alternative exists). Do NOT enable another engine without a new
# pre-registered hypothesis — "Enabling more engines (any)" is on the
# dead list (H015, run twice): every addition diluted, and subset
# selection was shown to be universe-dependent noise.

smc_full_spec: false   # H017 FAILED — detectors stay in the codebase for future re-tests only.

# H019 (research/results/registry.json) — funding-rate/Fear&Greed squeeze-
# risk penalty for BTCUSD/ETHUSD only (confluence/crypto_positioning_
# modulator.py). Stays FALSE until the A/B backtest passes H019's own
# pre-registered decision rule AND (separately) a live funding-rate/
# Fear-Greed feed exists — main._crypto_positioning_adjustment only ever
# reads an INJECTED context, never a live API call, so this flag is
# already inert in live trading regardless of its value today.
crypto_positioning_modulator: false

enabled:
  divergence: false
  ict: false
  macro: false
  market_structure: false
  nnfx: true
  price_action: true
  quant: false
  sentiment: false
  smc: true
  wyckoff: true

# Confluence Engine Overhaul Phase 1 (indicator unification & config
# extraction) — every hardcoded scoring/threshold constant from the 6
# engines NOT slated for a Phase 3 full rebuild (smc, price_action, nnfx,
# wyckoff, ict, market_structure), transcribed at TODAY's exact values.
# This is a PURE REFACTOR: moving WHERE these numbers live, never WHAT
# they mean or how they combine — verified bit-identical to pre-refactor
# behavior by tests/test_engine_config_extraction_no_behavior_change.py.
# Each engine reads its own sub-key via self.thresholds.get(name,
# CURRENT_HARDCODED_VALUE) — so an incomplete or missing thresholds block
# degrades to identical behavior, never a crash. sentiment is deliberately
# NOT extracted here — its Phase 3 rebuild replaces its thresholds
# wholesale, so extracting soon-to-be-discarded numbers now would be
# wasted work. quant (Phase 3a, 2026-08-01), divergence (Phase 3b,
# 2026-08-01), and macro (Phase 3c, 2026-08-01) were all fully rebuilt —
# their thresholds blocks below are config-first from day one, not a
# post-hoc extraction of legacy magic numbers. price_action_v2/wyckoff_v2
# (Track C, Phase 4, 2026-08-01) are AD-HOC-ONLY engine variants — see
# their own block comments below and backtesting/backtest_engine.py's
# build_engine_config_override docstring — never activated by this file's
# own enabled: block.
thresholds:
  macro:
    dxy_ema_fast: 10
    dxy_ema_slow: 20
    dxy_score_scale: 15.0
    dxy_score_cap: 40.0
    dxy_weight: 0.6
    spy_ma_period: 20
    vix_low: 15
    vix_high: 25
    gold_spy_lookback: 5
    gold_spy_threshold_pct: 0.01
    credit_spread_lookback_days: 20
    credit_spread_widen_threshold: 0.1
    fed_balance_sheet_lookback_weeks: 8
    fed_balance_sheet_threshold_pct: 0.01
    commodity_lookback_periods: 20
    commodity_flat_threshold_pct: 0.02
    risk_confirm_score: 30.0
    risk_conflict_penalty: 10.0
    score_cap: 70.0
    score_neutral_floor: 15.0

  divergence:
    min_bars: 80
    atr_period: 14
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    rsi_overbought: 70
    rsi_oversold: 30
    swing_min_move_atr_mult: 1.5
    swing_min_bars_between: 3
    regular_base_score: 55.0
    regular_magnitude_scale: 1000.0
    regular_magnitude_cap: 25.0
    hidden_score: 40.0
    triple_bonus: 15.0
    macd_confirm_bonus: 15.0
    macd_only_scale: 0.75
    mtf_confirm_bonus: 10.0
    mtf_conflict_penalty: 5.0
    score_cap: 90.0
    score_neutral_floor: 15.0

  quant:
    min_bars: 100

    # Rolling z-score
    zscore_window: 20

    # Hurst exponent (R/S analysis)
    hurst_lookback: 500
    hurst_lags: [10, 20, 40, 80, 160]
    hurst_min_lags: 4
    hurst_trend_threshold: 0.55
    hurst_mr_threshold: 0.45

    # Autocorrelation (returns, lag-1)
    autocorr_lookback: 100
    autocorr_threshold: 0.10

    # Volatility regime (ATR percentile)
    atr_period: 14
    atr_lookback: 100
    vol_regime_low_pct: 0.25
    vol_regime_high_pct: 0.80

    # Shannon entropy of returns
    entropy_lookback: 100
    entropy_bins: 10
    entropy_random_threshold: 0.90

    # Efficiency ratio (Kaufman's)
    er_period: 10
    er_trend_threshold: 0.30
    er_mr_threshold: 0.15

    # Variance ratio (Lo-MacKinlay, simple overlapping estimator)
    variance_ratio_q: 10
    variance_ratio_lookback: 200
    vr_trend_threshold: 1.10
    vr_mr_threshold: 0.90

    # ADF stationarity test
    adf_lookback: 100
    adf_min_bars: 30
    adf_p_threshold: 0.05

    # Half-life of mean reversion (OU regression)
    halflife_lookback: 100
    halflife_min_bars: 30
    halflife_fast_bars: 10
    halflife_max_bars_for_mr_vote: 20

    # Realized volatility (annualized). trading_days_per_year_fx corrects
    # the FX/metals trading calendar (~261 days/year, not 365) — only
    # applied when analyze() positively identifies a non-24/7 symbol;
    # unknown-symbol/direct-function callers keep the prior 365-day
    # assumption (see engines/quant_engine.py::_bars_per_year).
    realized_vol_window: 20
    bars_per_year_default: 8760.0
    trading_days_per_year_fx: 261.0

    # Volatility clustering (ARCH-effect proxy) — informational only
    vol_clustering_lookback: 100

    # RSI (SMA-smoothed, utils.indicators.rsi) — reused for confirmation
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    rsi_bull_confirm: 55
    rsi_bear_confirm: 45
    rsi_confirm_score: 15.0
    rsi_conflict_penalty: 10.0

    # Regime vote resolution
    regime_min_votes: 2
    regime_margin: 1

    # MEAN_REVERTING branch
    mr_zscore_entry: 2.0
    mr_base_score: 40.0
    mr_zscore_scale: 10.0
    mr_zscore_bonus_cap: 20.0
    mr_halflife_confirm_score: 5.0

    # TRENDING branch
    trend_direction_lookback: 20
    trend_base_score: 35.0
    trend_er_scale: 40.0
    trend_er_bonus_cap: 25.0

    # Global
    score_cap: 70.0
    score_neutral_floor: 15.0

  price_action:
    min_bars: 30
    rsi_period: 14
    rsi_bull: 55
    rsi_bear: 45
    rsi_momentum_score: 30.0
    rsi_overbought: 70
    rsi_overbought_score: 15.0
    rsi_oversold: 30
    rsi_oversold_score: 15.0
    bb_period: 20
    bb_std: 2.0
    bb_upper_pct: 0.8
    bb_upper_score: 20.0
    bb_lower_pct: 0.2
    bb_lower_score: 20.0
    bb_mid_score: 10.0
    pattern_score: 25.0
    doji_dampen: 0.7
    momentum_bars: 5
    momentum_atr_period: 14
    momentum_threshold: 0.5
    momentum_score: 20.0
    breakout_score: 15.0
    breakout_lookback: 20
    bull_score_min: 30.0
    score_cap: 80.0

  smc:
    swing_window: 3
    lookback: 6
    base_score_max: 65.0
    mixed_score: 20.0
    pick_tf_min_bars: 100
    fvg_lookback: 30
    order_block_lookback: 30
    order_block_displacement_atr: 1.0
    bos_choch_window: 3
    component_weight_bos_choch: 12.0
    component_weight_fvg: 8.0
    component_weight_order_block: 8.0
    full_spec_score_cap: 85.0
    full_spec_neutral_floor: 20.0
    full_spec_mixed_lean_score: 28.0

  nnfx:
    min_bars: 210
    ema_fast: 50
    ema_mid: 100
    ema_slow: 200
    adx_period: 14
    baseline_score: 25.0
    stack_aligned_score: 20.0
    stack_weak_score: 5.0
    adx_strong: 25
    adx_strong_score: 20.0
    adx_moderate: 15
    adx_moderate_score: 8.0
    adx_weak_penalty: 15.0
    adx_weak_neutral_floor: 15.0
    rsi_period: 14
    rsi_confirm_score: 15.0
    rsi_conflict_penalty: 10.0
    score_cap: 80.0

  wyckoff:
    min_bars: 40
    range_lookback: 40
    spring_tolerance: 0.002
    range_atr_max: 8.0
    range_recent_lookback: 10
    spring_upthrust_score: 45.0
    range_position_score: 25.0
    range_position_low_pct: 0.25
    range_position_high_pct: 0.75
    stopping_volume_score: 20.0
    climax_score: 15.0
    no_demand_score: 15.0
    no_supply_score: 15.0
    score_cap: 75.0
    score_neutral_floor: 20.0

  # Track C (Phase 4, 2026-08-01) — PriceAction v2. AD-HOC-ONLY: reachable
  # exclusively via backtesting.backtest_engine.build_engine_config_
  # override's engine_variants param (Mission Center). This block's
  # presence does NOT activate v2 live — engines.enabled.price_action
  # stays true and still loads v1 unconditionally; see backtest_engine.py's
  # variant-resolution loop. Genuinely no RSI/Bollinger Bands — deliberately
  # dropped, see engines/price_action_engine_v2.py's module docstring.
  price_action_v2:
    min_bars: 30
    atr_period: 14
    fakey_score: 30.0
    three_bar_play_score: 20.0
    micro_trend_score: 15.0
    failed_breakout_score: 25.0
    opening_drive_score: 15.0
    closing_strength_score: 15.0
    compression_bonus_score: 15.0
    micro_trend_lookback: 5
    micro_trend_swing_window: 2
    compression_short_lookback: 5
    compression_long_lookback: 20
    vcp_lookback: 6
    vcp_bonus_threshold: 0.6
    failed_breakout_lookback: 20
    failed_breakout_tolerance: 0.002
    opening_drive_wick_max_pct: 0.25
    fakey_break_tolerance: 0.001
    three_bar_play_pause_max_range_pct: 0.5
    bull_score_min: 30.0
    score_cap: 80.0

  # Track C (Phase 4, 2026-08-01) — Wyckoff v2. AD-HOC-ONLY, same
  # non-activation guarantee as price_action_v2 above. Superset of
  # `wyckoff:`'s 14 keys — WyckoffEngineV2.decide() calls wyckoff_engine.
  # decide() internally for its base layer, reading these SAME v1 key
  # names from this block (never wyckoff:'s own), plus the new
  # phase-machine/Composite-Operator-footprint keys below.
  wyckoff_v2:
    # v1 keys, identical starting values (proven heuristics, reused)
    min_bars: 60
    range_lookback: 40
    spring_tolerance: 0.002
    range_atr_max: 8.0
    range_recent_lookback: 10
    spring_upthrust_score: 45.0
    range_position_score: 25.0
    range_position_low_pct: 0.25
    range_position_high_pct: 0.75
    stopping_volume_score: 20.0
    climax_score: 15.0
    no_demand_score: 15.0
    no_supply_score: 15.0
    score_neutral_floor: 20.0
    # new: climax (Selling/Buying Climax) detection
    climax_lookback: 60
    climax_atr_multiple: 2.5
    climax_vol_ratio: 1.8
    # new: Automatic Rally/Reaction
    ar_lookback: 15
    ar_swing_window: 2
    # new: Secondary Test
    st_lookback: 25
    st_tolerance: 0.003
    # new: Sign of Strength/LPS (accumulation) + Sign of Weakness/LPSY (distribution mirror)
    sos_lookback: 20
    sos_breakout_atr_multiple: 1.2
    sos_score: 30.0
    lps_score: 20.0
    lps_max_pullback_pct: 0.5
    sow_score: 30.0
    lpsy_score: 20.0
    # new: Composite Operator footprint (wires in the previously-dead _effort_vs_result)
    effort_lookback: 10
    effort_spread_ratio: 1.2
    result_body_ratio: 0.5
    co_footprint_score: 15.0
    # new: Phase E confirmation
    phase_e_atr_multiple: 1.5
    score_cap: 85.0

  ict:
    min_bars: 30
    dealing_range_lookback: 20
    premium_pct: 0.60
    discount_pct: 0.40
    # ICT-SEMANTICS-FIX (Engine Refinement V1 #362, pre-approved by the
    # operator): zone_score/killzone_score/judas_confirm_score/
    # judas_conflict_penalty (the pre-fix key set) let premium/discount
    # zone position and killzone session timing auto-generate bias/score
    # directly — conflating CONTEXT with actual trading-event evidence.
    # Superseded by the keys below: Judas swing (a real detected false-
    # breakout+reversal) is now the only signal source; zone/killzone/
    # trend are confirmation-only modifiers on an already-real event.
    # ICT is disabled by default (engines.enabled.ict: false above) —
    # this changed zero live-decision behavior.
    judas_base_score: 45.0
    zone_confirm_score: 20.0
    zone_conflict_penalty: 10.0
    killzone_confirm_score: 15.0
    trend_conflict_penalty: 10.0
    trend_ema_fast: 20
    trend_ema_slow: 50
    trend_buffer_pct: 0.001
    score_cap: 80.0
    score_neutral_floor: 20.0

  market_structure:
    min_bars: 30
    h1_window: 3
    h4_window: 2
    h1_lookback_bars: 100
    h4_lookback_bars: 60
    aligned_bonus: 10.0
    aligned_score_cap: 85.0
    disagree_score: 50.0
    h1_only_score: 40.0
    bos_strength: 65
    choch_strength: 75
    ranging_strength: 20
    weak_structure_strength: 45

# Metadata only (see file header) — bump when an engine's internal logic
# changes materially, so research manifests can be cross-referenced to a
# specific engine version rather than just a git commit.
versions:
  divergence: "2.0"
  ict: "1.1"
  macro: "2.0"
  market_structure: "1.1"
  nnfx: "1.0"
  price_action: "1.0"
  price_action_v2: "2.0"
  quant: "2.0"
  sentiment: "1.0"
  smc: "1.0"
  wyckoff: "1.0"
  wyckoff_v2: "2.0"
